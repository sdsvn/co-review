schema: spec-driven

context: |
  Co-Review is a repository review app: a person reviews a whole repository, their agent's change, someone
  else's pull request or a design document, with agents taking part as co-reviewers (MCP and ACP).

  Tech stack: a fork of a native Rust editor, Lapce (see the change's design.md). The host provides
  the IDE: editor, file tree, search, Git, language servers, terminal. Co-Review adds the review in new crates named
  review_*, with as few edits to the host's own code as possible (see INSTRUCTIONS.md).

  Platforms: macOS, Linux and Windows desktop. There is no browser app.

  Reference implementation: the Theia app (release 0.6.x), now removed from this repository. The fixtures recorded
  from it (crates/*/tests/fixtures, crates/review_mcp/tests/conformance) and the docs (docs/workflows.md,
  docs/agents.md, docs/design-docs.md, llms.txt) describe the behaviour these specs require.

rules:
  specs:
    - Name no host editor in specs or the proposal; host-specific choices belong in design.md
    - Specify only behaviour Co-Review has today. Nothing a host editor provides, and no new features
    - Describe what the reviewer or the agent observes; put mechanisms in design.md unless they are part of the contract
    - The MCP tool contract in llms.txt and the data under ~/.co-review are part of the contract
    - File paths in scenarios must hold on Windows as well as macOS and Linux
  tasks:
    - Check a capability against the fixtures recorded from the Theia app (MCP sessions, corpora)
    - Every task that touches files, git or processes is verified on Windows CI
