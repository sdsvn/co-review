# Tests and lints Co-Review's Rust crates (crates/review_*) on macOS, Linux and Windows, and builds the
# `co-review` command for each. The toolchain comes from rust-toolchain.toml.
name: Rust

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/rust.yml
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/rust.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-latest }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: win-x64, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Git identity
        # Tests commit to temporary repositories.
        run: |
          git config --global user.name "Co-Review CI"
          git config --global user.email "ci@co-review.invalid"
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build the co-review command
        run: cargo build --release -p review_cli
      - uses: actions/upload-artifact@v7
        with:
          name: co-review-cli-${{ matrix.name }}
          path: |
            target/release/co-review
            target/release/co-review.exe
          if-no-files-found: error
