# Builds the Co-Review desktop app for macOS, Linux and Windows. A `v*` tag publishes the builds as a GitHub
# release, which install.sh downloads (releases/latest/download/Co-Review-<os>-<arch>.<ext>). For macOS and Linux it
# also publishes the app folder on its own (Co-Review-<os>-<arch>-app.tar.xz) and what surrounds it
# (Co-Review-<os>-<arch>-runtime.txt): an update whose runtime is unchanged downloads only the app folder. Run it by
# hand to get the builds as workflow artifacts without releasing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-latest, args: --mac --arm64 }
          - { name: linux-x64, os: ubuntu-latest, args: --linux --x64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, args: --linux --arm64 }
          - { name: win-x64, os: windows-latest, args: --win --x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libx11-dev libxkbfile-dev rpm
      - name: Versions
        # Every agent integration ships at the app's version; a tag must match it too.
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then node bin/check-versions.mjs --tag "$GITHUB_REF_NAME"; else node bin/check-versions.mjs; fi
      - name: Install
        run: npm ci
      - name: VS Code extensions
        run: npm run download:plugins
      - name: Build
        run: |
          npm run -w @co-review/review build
          cd applications/electron
          ../../node_modules/.bin/theia rebuild:electron --cacheRoot ../..
          ../../node_modules/.bin/theia build --mode production
      - name: Package
        env:
          # Unsigned builds; install.sh signs the macOS app ad hoc on install.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          rm -rf applications/electron/plugins && cp -R plugins applications/electron/plugins
          node bin/runtime-key.mjs > applications/electron/runtime.txt
          cd applications/electron
          ../../node_modules/.bin/electron-builder --config electron-builder.yml ${{ matrix.args }} \
            --publish never -c.extraMetadata.version="$version"
      - name: App folder (macOS, Linux)
        # The app folder alone, for an update that keeps the installed runtime (see bin/runtime-key.mjs).
        if: runner.os != 'Windows'
        run: |
          cd applications/electron/dist
          name="Co-Review-${{ matrix.name }}"
          app=$(find . -path '*/Contents/Resources/app' -o -path '*-unpacked/resources/app' | head -n 1)
          [[ -f "$app/runtime.txt" ]] || { echo "no app folder with runtime.txt in dist"; exit 1; }
          XZ_OPT=-9T0 tar -C "$(dirname "$app")" -cJf "$name-app.tar.xz" app
          cp ../runtime.txt "$name-runtime.txt"
          ls -l "$name-app.tar.xz" "$name-runtime.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: co-review-${{ matrix.name }}
          path: |
            applications/electron/dist/Co-Review-*.zip
            applications/electron/dist/Co-Review-*.dmg
            applications/electron/dist/Co-Review-*.tar.gz
            applications/electron/dist/Co-Review-*.AppImage
            applications/electron/dist/Co-Review-*.deb
            applications/electron/dist/Co-Review-*.exe
            applications/electron/dist/Co-Review-*-app.tar.xz
            applications/electron/dist/Co-Review-*-runtime.txt
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
