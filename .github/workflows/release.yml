# Builds the Co-Review app (Lapce with Co-Review's crates) and the `co-review` command for macOS, Linux and Windows,
# and packages them with packaging/package.sh. A `v*` tag publishes them as a GitHub release, which install.sh
# downloads (releases/latest/download/Co-Review-<os>-<arch>.<ext>) and the app's updater checks. Run it by hand to
# get the builds as workflow artifacts without releasing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-latest }
          # The oldest supported Ubuntu, so the binaries run on any distribution with glibc 2.35 or later.
          - { name: linux-x64, os: ubuntu-22.04 }
          - { name: linux-arm64, os: ubuntu-22.04-arm }
          - { name: win-x64, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Versions
        # Every agent integration ships at the app's version (Cargo.toml); a tag must match it too.
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then node bin/check-versions.mjs --tag "$GITHUB_REF_NAME"; else node bin/check-versions.mjs; fi
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo make -f Makefile.lapce ubuntu-deps
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: command -v iscc || [ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup --no-progress -y
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build and package
        # Unsigned builds; install.sh signs the macOS app ad hoc on install.
        run: PROFILE=release-lto OUT="$PWD/dist" packaging/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: co-review-${{ matrix.name }}
          path: |
            dist/Co-Review-*.zip
            dist/Co-Review-*.tar.gz
            dist/Co-Review-*.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
