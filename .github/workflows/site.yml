# Builds the docs site (site/, Astro + Starlight) and publishes it to GitHub Pages:
# https://sdsvn.github.io/co-review/
name: Site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - llms.txt
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Runs `npm run build` in site/: syncs ../docs into the site, type-checks, builds, and uploads dist/.
      - uses: withastro/action@v6
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
