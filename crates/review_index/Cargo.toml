[package]
name = "review_index"
version = "0.1.0"
edition.workspace = true
publish = false
license = "EPL-2.0"

[lib]
path = "src/review_index.rs"

[dependencies]
review_model.workspace = true
review_store.workspace = true
anyhow.workspace = true
rayon = "1.10"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1_smol = "1.0"
sha2.workspace = true
# Same tree-sitter as lapce-core (one `links = "tree-sitter"` per build). The grammars are pinned
# to the last releases generated with ABI 14, the newest ABI tree-sitter 0.22 can load.
tree-sitter = "0.22.6"
tree-sitter-language = "0.1"
tree-sitter-go = "=0.23.4"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.23.1"
tree-sitter-python = "=0.23.6"
tree-sitter-java = "=0.23.5"
tree-sitter-rust = "=0.23.3"
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c = "=0.23.4"
tree-sitter-ruby = "=0.23.1"
tree-sitter-php = "=0.23.11"
tree-sitter-bash = "=0.23.3"
tree-sitter-powershell = "=0.25.9"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
