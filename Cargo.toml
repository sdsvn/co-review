# Co-Review's review crates. When Zed is merged into this repository (it becomes the fork), these members and
# dependencies move into Zed's root Cargo.toml; versions here already follow Zed's.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.86"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
futures = "0.3.31"
log = { version = "0.4", default-features = false, features = ["std"] }
parking_lot = "0.12.1"
pretty_assertions = "1.3.0"
regex = { version = "1.5", default-features = false, features = ["std", "perf", "unicode"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
similar = "2.7"
smol = "2.0"
tempfile = "3.20.0"
uuid = { version = "1.1", features = ["serde", "v4"] }

review_anchor = { path = "crates/review_anchor" }
review_bundle = { path = "crates/review_bundle" }
review_code = { path = "crates/review_code" }
review_design = { path = "crates/review_design" }
review_github = { path = "crates/review_github" }
review_graph = { path = "crates/review_graph" }
review_index = { path = "crates/review_index" }
review_model = { path = "crates/review_model" }
review_pages = { path = "crates/review_pages" }
review_store = { path = "crates/review_store" }

[workspace.lints.clippy]
unwrap_used = "deny"
