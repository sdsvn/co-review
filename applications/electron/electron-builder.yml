# Packages the Co-Review desktop app. Run through `make package` (builds and copies plugins first).
appId: dev.co-review.app
productName: Co-Review
copyright: Co-Review contributors
electronDist: ../../node_modules/electron/dist
asar: false # Theia loads plugins and native modules from disk
directories:
  buildResources: resources
  output: dist
files:
  - package.json
  - scripts
  - lib
  - src-gen
  - plugins
  - "!**/*.map"
  # The `co-review` CLI (and its installer), run on the app's Electron with ELECTRON_RUN_AS_NODE.
  - from: ../../bin
    to: bin
  # Agent integrations, installed from the app (Review: Add Co-Review to an Agent Harness / Install Agent Skills):
  # the Claude Code plugin and its marketplace, and the Pi package (which reads ../../plugin/skills).
  - from: ../../plugin
    to: plugin
  - from: ../../.claude-plugin
    to: .claude-plugin
  - from: ../../integrations/pi
    to: integrations/pi
  # The app icon, for the Linux desktop entry written by install.sh.
  - from: resources
    to: icons
    filter: [icon.png]
extraMetadata:
  main: scripts/electron-main.js
# Stable names (no version), so install.sh can fetch releases/latest/download/Co-Review-<os>-<arch>.<ext>.
artifactName: ${productName}-${os}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  identity: null # unsigned local build; set CSC_* env vars to sign
  target: [dmg, zip]
linux:
  category: Development
  executableName: co-review
  # tar.gz is what install.sh installs (the CLI runs on its Electron); AppImage and deb for manual installs.
  target: [tar.gz, AppImage, deb]
win:
  target: [nsis]
